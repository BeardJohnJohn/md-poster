<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>{{ARTICLE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   XHS Card Template — Open Source Edition
   ============================================================
   Usage:
   1. Replace {{PLACEHOLDERS}} with actual content
   2. Open in browser, press ← → to navigate pages
   3. Use screenshot.py to capture each page as PNG
   ============================================================ */

/* --- RESET & BASE --- */
html, body {
  background: #F9F9F6;
  margin: 0; padding: 0;
  overflow: hidden;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
html, body {
  outline: none !important;
  box-shadow: none !important;
}

/* --- CARD CONTAINER --- */
.card {
  width: 1080px;
  background: #F9F9F6;
  margin: 0 auto;
  display: none;
  outline: none !important;
  box-shadow: none !important;
}
.card.active { display: block; }

/* --- CONTENT AREA --- */
.content {
  padding: 90px;
  padding-bottom: 40px;
  font-family: 'Noto Serif SC', serif;
  font-size: 34px;
  color: #1A1A1A;
  line-height: 2;
  font-weight: 400;
}

/* --- TYPOGRAPHY --- */
h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 56px;
  font-weight: 700;
  color: #000;
  line-height: 1.3;
  margin: 0 0 50px 0;
}
h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 44px;
  font-weight: 700;
  color: #000;
  margin: 0 0 34px;
  line-height: 1.3;
}
p { margin: 0 0 34px 0; }
strong { font-weight: 700; }
blockquote {
  border-left: 6px solid #4a9eff;
  padding-left: 34px;
  margin: 34px 0;
  font-style: italic;
  color: #333;
}
ul, ol { font-size: 34px; padding-left: 34px; margin-bottom: 34px; }
li { margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 28px; margin: 18px 0; }
th { background: #f0efe8; font-weight: 700; padding: 10px 12px; border-bottom: 2px solid #d0cec5; text-align: left; }
td { padding: 8px 12px; border-bottom: 1px solid #E8E6D9; line-height: 1.6; }

/* --- AUTHOR AREA (Page 1 only) --- */
.author-area {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 50px;
}
.avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 2px solid #E8E6D9;
  object-fit: cover;
}
.author-info { display: flex; flex-direction: column; gap: 6px; }
.author-name { font-size: 30px; color: #333; font-weight: 400; line-height: 1.2; }
.author-date { font-size: 22px; color: #888; font-weight: 300; font-family: 'Inter', sans-serif; line-height: 1.3; }
.reading-meta { font-size: 22px; color: #888; font-weight: 300; font-family: 'Inter', sans-serif; line-height: 1.3; }

/* --- PAGE FOOTER (inside .content, never gets cut off) --- */
.page-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 50px;
  padding: 24px 0 50px 0;
  border-top: 1px solid #E8E6D9;
}
.footer-title { font-size: 20px; color: #aaa; font-family: 'Inter', sans-serif; font-weight: 300; }
.footer-page { font-size: 22px; color: #aaa; font-family: 'Inter', sans-serif; font-weight: 400; }

/* --- NAV CONTROLS --- */
#navControls {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.7); color: #fff; padding: 10px 24px;
  border-radius: 30px; font-family: Inter, sans-serif; font-size: 16px;
  z-index: 999; display: none; gap: 16px; align-items: center;
}
#navControls button {
  background: rgba(255,255,255,.2); border: none; color: #fff;
  padding: 6px 16px; border-radius: 16px; cursor: pointer; font-size: 14px;
}
#navControls button:hover { background: rgba(255,255,255,.35); }
</style>
</head>
<body>

<!-- ============================================================
     CONTENT PAGES
     Each .card div is one XHS image card page.
     Replace the content below with your article content.
     ============================================================ -->

<!-- PAGE 1: Title + Author + Hook -->
<div class="card active" data-page="1">
<div class="content">
<h1>{{ARTICLE_TITLE}}</h1>
<div class="author-area">
  <img class="avatar" src="{{AVATAR_SRC}}" alt="avatar">
  <div class="author-info">
    <span class="author-name">{{AUTHOR_NAME}}</span>
    <span class="reading-meta">约 {{WORD_COUNT}} 字 · 阅读约 {{READ_TIME}} 分钟</span>
  </div>
</div>

<!-- PAGE 1 CONTENT HERE -->

<div class="page-footer">
  <span class="footer-title">{{FOOTER_TITLE}}</span>
  <span class="footer-page">1 / {{TOTAL_PAGES}}</span>
</div>
</div>
</div>

<!-- PAGE 2 -->
<div class="card" data-page="2">
<div class="content">
<h2>{{SECTION_TITLE}}</h2>

<!-- PAGE 2 CONTENT HERE -->

<div class="page-footer">
  <span class="footer-title">{{FOOTER_TITLE}}</span>
  <span class="footer-page">2 / {{TOTAL_PAGES}}</span>
</div>
</div>
</div>

<!-- Add more pages as needed... -->

<!-- ============================================================
     NAVIGATION (press N to toggle, ← → to navigate)
     ============================================================ -->
<div id="navControls">
  <button onclick="goPage(-1)">← Prev</button>
  <span id="pageIndicator">1 / ?</span>
  <button onclick="goPage(1)">Next →</button>
</div>

<script>
/* ============================================================
   XHS Card Navigation & Screenshot System
   ============================================================ */
let currentPage = 1;
const totalPages = document.querySelectorAll('.card').length;

// URL parameter support: ?page=3
const params = new URLSearchParams(window.location.search);
if (params.get('page')) currentPage = parseInt(params.get('page'));

function showPage(n) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const target = document.querySelector(`.card[data-page="${n}"]`);
  if (target) target.classList.add('active');
  const indicator = document.getElementById('pageIndicator');
  if (indicator) indicator.textContent = n + ' / ' + totalPages;
  currentPage = n;
}

function goPage(delta) {
  const next = currentPage + delta;
  if (next >= 1 && next <= totalPages) showPage(next);
}

/**
 * Screenshot Mode — call from console before capturing.
 * Removes ALL browser artifacts (extensions, overlays, shadows).
 * Returns { height, page, status } for viewport sizing.
 */
function screenshotMode(pageNum) {
  if (pageNum) showPage(pageNum);

  // Remove browser extension artifacts
  document.querySelectorAll('preact-border-shadow-host').forEach(e => e.remove());

  // Clone the active card and isolate it
  const activeCard = document.querySelector('.card.active');
  if (!activeCard) return { error: 'No active card found' };
  const clone = activeCard.cloneNode(true);

  // Clear body and re-insert only the card
  document.body.innerHTML = '';
  document.body.style.cssText = 'background:#F9F9F6;margin:0;padding:0;outline:none!important;box-shadow:none!important';
  document.documentElement.style.cssText = 'background:#F9F9F6;margin:0;padding:0;outline:none!important;box-shadow:none!important';
  document.body.appendChild(clone);
  clone.style.display = 'block';

  return {
    height: clone.scrollHeight,
    page: pageNum || currentPage,
    status: 'ready'
  };
}

// Initialize
showPage(currentPage);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goPage(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goPage(-1);
  if (e.key === 'n' || e.key === 'N') {
    const nav = document.getElementById('navControls');
    nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
  }
});
</script>
</body>
</html>
